app = "gigbot"
# Mumbai. This said "ams" while README.md told you to create the volume in
# "bom" - a machine cannot mount a volume in another region, so following both
# gets you a deploy that will not place. They agree now.
#
# bom over ams because the old justification ("any region works, it's
# outbound-only") stopped being true when the dashboard started listening:
# there is now an inbound page you load from Pakistan, and Mumbai is ~2000km
# away against Amsterdam's ~6000km. Telegram is reachable from Indian
# datacentres, so the ISP-filtering problem this deploy exists to solve is
# still solved.
#
# Free to change ONLY because nothing has been deployed yet. Once a volume
# holds a real corpus, this line is pinned - editing it strands the database.
primary_region = "bom"

[build]

[env]
  DB_PATH = '/data/seen.db'
  POLL_INTERVAL = '1800'
  # main.py serves the read-only corpus dashboard here. Must equal
  # http_service.internal_port below, or Fly routes to a closed port.
  DASHBOARD_PORT = '8080'

[[mounts]]
  source = 'gigbot_data'
  destination = '/data'

# The dashboard is the only thing that listens, and it is unauthenticated:
# https://<app>.fly.dev/ serves the whole corpus to anyone who asks. That is a
# deliberate call - public job postings, personal watcher - but it does mean
# the hostname is the only thing standing between the corpus and the internet.
# If that changes, delete this whole block and reach it with
# `fly proxy 8080:8080` instead; nothing else needs to change.
[http_service]
  internal_port = 8080
  force_https = true
  # Both of these were 'stop' / 0 from `fly launch`, which is correct for a web
  # app and wrong for a watcher: Fly stops an idle machine when nothing is
  # requesting it, and this process is a poll loop that must keep running
  # whether or not anyone opens the dashboard. Stopping it also suppresses
  # notifications silently - the machine simply is not there to poll.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  # Single instance only. The volume binds to one machine; `scale count 2`
  # gives two independent databases and duplicate notifications.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
