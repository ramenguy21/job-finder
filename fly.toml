# fly.toml app configuration file generated for gigbot on 2026-08-15T07:03:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gigbot'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/data/seen.db'
  POLL_INTERVAL = '1800'

[[mounts]]
  source = 'gigbot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
