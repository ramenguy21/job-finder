app = "gigbot"
# Amsterdam. The volume is pinned to this region - changing it strands the
# database. Any region works for the app itself, it's outbound-only.
primary_region = "ams"

[build]

[env]
  DB_PATH = '/data/seen.db'
  POLL_INTERVAL = '1800'

[[mounts]]
  source = 'gigbot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
